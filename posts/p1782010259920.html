    <div class="poll-question">📊 voce confia em politico?</div>

  </div>
  <script>
  (function(){
    const pollData={"question": "voce confia em politico?", "options": ["Sim", "Não"]};
    const postId='p1782010259920';
    const ns='tempos-ridiculos.com';
    const votedKey='tr_poll_voted_'+postId;
    const container=document.getElementById('poll-options');
    function pct(vals,i){const total=vals.reduce((a,b)=>a+b,0);return total?Math.round(vals[i]/total*100):0;}
    function fetchAll(cb){
      Promise.all(pollData.options.map((opt,i)=>
        fetch('https://abacus.jasoncameron.dev/get/'+ns+'/poll-'+postId+'-'+i).then(r=>r.ok?r.json():{value:0}).catch(()=>({value:0}))
      )).then(results=>cb(results.map(r=>r.value||0)));
    }
    function renderResults(vals,myChoice){
      container.innerHTML=pollData.options.map((opt,i)=>
        '<div class="poll-result'+(i==myChoice?' poll-result-mine':'')+'"><div class="poll-result-label">'+(i==myChoice?'✓ ':'')+opt+' — '+pct(vals,i)+'% ('+vals[i]+')</div><div class="poll-bar-bg"><div class="poll-bar-fill" style="width:'+pct(vals,i)+'%"></div></div></div>'
      ).join('')+'<button class="poll-change-btn" id="poll-change-btn">Mudar meu voto</button>';
      document.getElementById('poll-change-btn').addEventListener('click',showOptions);
    }
    function vote(i){
      fetch('https://abacus.jasoncameron.dev/hit/'+ns+'/poll-'+postId+'-'+i).then(()=>{
        localStorage.setItem(votedKey,i);
        fetchAll(vals=>renderResults(vals,i));
      });
    }
    function showOptions(){
      container.innerHTML=pollData.options.map((opt,i)=>
        '<button class="poll-option-btn" data-i="'+i+'">'+opt+'</button>'
      ).join('');
      container.querySelectorAll('.poll-option-btn').forEach(btn=>{
        btn.addEventListener('click',function(){vote(this.dataset.i);});
      });
    }
    const saved=localStorage.getItem(votedKey);
    if(saved!==null){
      fetchAll(vals=>renderResults(vals,parseInt(saved)));
    } else {
      showOptions();
    }
  })();
  <\/script>

<script>
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function fmtDate2(iso){return new Date(iso).toLocaleDateString('pt-BR',{day:'numeric',month:'short',year:'numeric'});}
function getCmts(){try{return JSON.parse(localStorage.getItem('tr_cmts_p1782010259920')||'[]');}catch(e){return[];}}
function saveCmts(c){localStorage.setItem('tr_cmts_p1782010259920',JSON.stringify(c));}
function renderCmts(){
  const list=getCmts();
  document.getElementById('cmt-list').innerHTML=list.length?list.map(c=>'<div class="comment-item"><div class="comment-author">'+escapeHtml(c.name)+'</div><div class="comment-date">'+fmtDate2(c.date)+'</div><div class="comment-text">'+escapeHtml(c.text)+'</div></div>').join(''):'<p style="color:var(--gray);font-style:italic;font-size:.9rem">Nenhum comentário ainda. Seja o primeiro!</p>';
}
function addComment(){
  const name=document.getElementById('cmt-name').value.trim()||'Anônimo';
  const text=document.getElementById('cmt-text').value.trim();
  if(!text)return;
  const list=getCmts();list.push({name,text,date:new Date().toISOString()});saveCmts(list);
  document.getElementById('cmt-name').value='';document.getElementById('cmt-text').value='';
  renderCmts();
}
renderCmts();
<\/script>
