  <div class="post-full-body"><p>A ANATOMIA DO MONSTRO: O Sistema Brasileiro Desenhado.O Estado não nasceu para servir ao cidadão; nasceu como uma máquina colonial de extração. Para que o topo continue intocado, o Leviatã aciona seus tentáculos de controle social.  Entenda c nos comentários abaixo: </p><p>🎭 O Teatro: Em público, simulam uma guerra mortal entre esquerda e direita. Nos bastidores, dividem o fundo eleitoral e privilégios. </p><p>📺 A Narrativa: Algoritmos injetam raiva para garantir que o povo gaste energia brigando entre si.</p><p>💸 O Sufoco: O esgotamento cognitivo por impostos e dívidas tira a força para enxergar a estrutura. </p><p>🛠️ A Saída: A libertação não vem de Messias político. Vem da autonomia, da consciência e de construir obras reais. O monstro é temporário.</p></div>

<script>
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function fmtDate2(iso){return new Date(iso).toLocaleDateString('pt-BR',{day:'numeric',month:'short',year:'numeric'});}
function getCmts(){try{return JSON.parse(localStorage.getItem('tr_cmts_p1782005179038')||'[]');}catch(e){return[];}}
function saveCmts(c){localStorage.setItem('tr_cmts_p1782005179038',JSON.stringify(c));}
function renderCmts(){
  const list=getCmts();
  document.getElementById('cmt-list').innerHTML=list.length?list.map(c=>'<div class="comment-item"><div class="comment-author">'+escapeHtml(c.name)+'</div><div class="comment-date">'+fmtDate2(c.date)+'</div><div class="comment-text">'+escapeHtml(c.text)+'</div></div>').join(''):'<p style="color:var(--gray);font-style:italic;font-size:.9rem">Nenhum comentário ainda. Seja o primeiro!</p>';
}
function addComment(){
  const name=document.getElementById('cmt-name').value.trim()||'Anônimo';
  const text=document.getElementById('cmt-text').value.trim();
  if(!text)return;
  const list=getCmts();list.push({name,text,date:new Date().toISOString()});saveCmts(list);
  document.getElementById('cmt-name').value='';document.getElementById('cmt-text').value='';
  renderCmts();
}
renderCmts();
<\/script>
