async function publishPostPage(post){
  const token=getGhToken();
  if(!token)return false;
  try{
    const html=buildPostPageHtml(post);
    const path=`posts/${post.id}.html`;
    const api=`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`;
    let sha=null;
    const head=await fetch(api,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});
    if(head.ok){const j=await head.json();sha=j.sha;}
    const content=btoa(unescape(encodeURIComponent(html)));
    const body={message:'Atualiza página do post '+post.id,content};
    if(sha)body.sha=sha;
    const put=await fetch(api,{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    return put.ok;
  }catch(e){return false;}
}

  if(!token)return false;
  try{
    const path=`posts/${postId}.html`;
    const api=`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`;
    const head=await fetch(api,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});
    if(!head.ok)return true; // já não existe, ok
    const j=await head.json();
    const del=await fetch(api,{method:'DELETE',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Remove página do post '+postId,sha:j.sha})});
    return del.ok;
  }catch(e){return false;}
}
function buildSitemapXml(posts){
  const urls=[`  <url>\n    <loc>${SITE_URL}/</loc>\n    <changefreq>daily</changefreq>\n    <priority>1.0</priority>\n  </url>`];
  posts.forEach(p=>{
    const lastmod=(p.date||'').slice(0,10);
    urls.push(`  <url>\n    <loc>${SITE_URL}/posts/${p.id}.html</loc>\n${lastmod?`    <lastmod>${lastmod}</lastmod>\n`:''}    <changefreq>monthly</changefreq>\n    <priority>0.8</priority>\n  </url>`);
  });
  return `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${urls.join('\n')}\n</urlset>\n`;
}
async function updateSitemap(){
  const token=getGhToken();
  if(!token)return false;
  try{
    const xml=buildSitemapXml(getPublicPosts());
    const path='sitemap.xml';
    const api=`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`;
    let sha=null;
    const head=await fetch(api,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});
    if(head.ok){const j=await head.json();sha=j.sha;}
    const content=btoa(unescape(encodeURIComponent(xml)));
    const body={message:'Atualiza sitemap.xml',content};
    if(sha)body.sha=sha;
    const put=await fetch(api,{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    return put.ok;
  }catch(e){return false;}
}

  });
}

function removeImg(idx,btn){uploadedImages[idx]=null;btn.parentElement.remove();}

async function publishPost(){
  if(isPublishing)return;
  const title=document.getElementById('post-title').value.trim();
  if(!title||!quillHasContent()){alert('Título e texto são obrigatórios!');return;}
  const failures=await resolvePendingQuillImages();
  if(failures>0&&!confirm(failures+' imagem(ns) não terminaram de enviar pro servidor e vão ficar mais pesadas no post (em base64). Quer publicar assim mesmo?'))return;
  const body=getQuillBody();
  const scheduleInput=document.getElementById('post-schedule').value;
  // Converte horário de Brasília (UTC-3) pra UTC
  const scheduledAt=scheduleInput?new Date(scheduleInput+'Z').toISOString().replace('Z','').split('.')[0]+'Z':null;
  const scheduledAtUTC=scheduleInput?new Date(new Date(scheduleInput).getTime()+3*60*60*1000).toISOString():null;
  const post={
    id:'p'+Date.now(),title,
    category:document.getElementById('post-category').value,
    summary:document.getElementById('post-summary').value.trim(),
    body,video:document.getElementById('post-video').value.trim(),
    images:uploadedImages.filter(Boolean),
    poll:getPollFromForm(),
    coverImage:selectedCoverImage,
    date:scheduledAtUTC||new Date().toISOString(),
    scheduledAt:scheduledAtUTC||null,
    archived:scheduledAtUTC?true:false
  };
  isPublishing=true;
  const btn=document.querySelector('.btn-publish'),originalText=btn.textContent;
  btn.disabled=true;btn.style.opacity='.6';
  let ok=false;
  try{
    if(post.images.length){
      btn.textContent='⏳ Enviando imagens...';
      post.images=await processPostImages(post.id,post.images);
    }
    btn.textContent='⏳ Publicando...';
    const posts=getPosts();posts.unshift(post);
    ok=await savePosts(posts);
    if(ok){btn.textContent='⏳ Criando página do post...';await publishPostPage(post);await updateSitemap();}
  }catch(e){
    alert('Erro inesperado ao publicar: '+e.message+'. Tente de novo.');
  }finally{
    btn.disabled=false;btn.style.opacity='';btn.textContent=originalText;
    isPublishing=false;
  }
  ['post-title','post-summary','post-video','post-poll-question','post-poll-options','post-schedule'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  if(quillEditor)quillEditor.setContents([]);
  const fb=document.getElementById('post-body-fallback');if(fb)fb.value='';
  document.getElementById('imgs-preview-grid').innerHTML='';
  uploadedImages=[];
  clearCoverImage();
  if(ok){
    const msg=document.getElementById('success-msg');
    msg.textContent='✓ Post publicado com sucesso!';
    msg.style.display='block';setTimeout(()=>msg.style.display='none',3000);
  }
  renderHome();
}

function switchTab(tab,el){
  document.querySelectorAll('.admin-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  document.getElementById('tab-novo').classList.toggle('active',tab==='novo');
  document.getElementById('tab-posts').classList.toggle('active',tab==='posts');
  if(tab==='posts')renderAdmin();
  if(tab==='novo')ensureQuillEditor();
}

async function loadNotifications(){
  const badge=document.getElementById('notif-badge');
  const list=document.getElementById('notif-list');
  try{
    const r=await fetch(`${GH_ISSUES_API}?state=open&per_page=20&sort=updated&direction=desc`,{headers:{Authorization:'Bearer '+getBotToken(),Accept:'application/vnd.github+json'}});
    const issues=await r.json();
    const lastSeen=localStorage.getItem('tr_notif_seen')||'1970-01-01T00:00:00Z';
    let newCount=0;
    const items=await Promise.all(issues.map(async issue=>{
      const r2=await fetch(`${GH_ISSUES_API}/${issue.number}/comments?per_page=5&sort=created&direction=desc`,{headers:{Authorization:'Bearer '+getBotToken(),Accept:'application/vnd.github+json'}});
      const comments=await r2.json();
      const postTitle=issue.title.replace('Comentários: ','');
      return comments.map(c=>{
        const isNew=c.created_at>lastSeen;
        if(isNew)newCount++;
        const nameMatch=(c.body||'').match(/^\*\*(.+?)\*\*/);
        const name=nameMatch?nameMatch[1]:'Anônimo';
        return{date:c.created_at,name,postTitle,isNew};
      });
    }));
    const flat=items.flat().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);
    if(badge){if(newCount>0){badge.style.display='flex';badge.textContent=newCount;}else{badge.style.display='none';}}
    if(list){
      if(flat.length===0){list.innerHTML='<p style="color:var(--gray);font-size:.85rem">Nenhuma atividade ainda.</p>';return;}
      list.innerHTML=flat.map(n=>`
        <div style="padding:.6rem 0;border-bottom:1px solid var(--border);${n.isNew?'color:var(--gold)':''}">
          <div style="font-size:.75rem;font-family:\'Space Mono\',monospace">${n.isNew?'🆕 ':''}<strong>${n.name}</strong> comentou</div>
          <div style="font-size:.8rem;color:var(--gray)">${n.postTitle.substring(0,50)} · ${fmtDate(n.date)}</div>
        </div>`).join('');
    }
  }catch(e){if(list)list.innerHTML='<p style="color:var(--gray);font-size:.85rem">Erro ao carregar notificações.</p>';}
}

function toggleNotifPanel(){
  const panel=document.getElementById('notif-panel');
  const isOpen=panel.style.display==='block';
  panel.style.display=isOpen?'none':'block';
  if(!isOpen){localStorage.setItem('tr_notif_seen',new Date().toISOString());const badge=document.getElementById('notif-badge');if(badge)badge.style.display='none';}
}

function renderAdmin(){
  const posts=getPosts(),list=document.getElementById('admin-posts-list');
  if(!list)return;
  if(posts.length===0){list.innerHTML='<div style="padding:2rem;text-align:center;color:var(--gray);font-style:italic">Nenhum post publicado ainda.</div>';return;}
  list.innerHTML=posts.map(p=>`<div class="admin-post-item${p.archived?' admin-post-archived':''}">
    <div class="admin-post-info">
      <h4>${p.title}${p.scheduledAt&&p.archived?' <span class="archived-badge">🕐 Agendado: '+new Date(p.scheduledAt).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+'</span>':p.archived?' <span class="archived-badge">📦 Arquivado</span>':''}</h4>
      <span>${p.category} · ${fmtDate(p.date)} · ${(p.images||[]).length} imagem(ns)</span>
    </div>
    <div class="admin-post-actions"><button class="btn-edit" onclick="editPost('${p.id}')">Editar</button><button class="btn-edit" onclick="toggleArchive('${p.id}')">${p.archived?'📤 Desarquivar':'📦 Arquivar'}</button><button class="btn-danger" onclick="deletePost('${p.id}')">Excluir</button></div>
  </div>`).join('');
}
async function toggleArchive(id){
  const posts=getPosts();
  const idx=posts.findIndex(p=>p.id===id);
  if(idx===-1)return;
  posts[idx]={...posts[idx],archived:!posts[idx].archived};
  const ok=await savePosts(posts);
  if(ok)await updateSitemap();
  else alert('Não consegui salvar a mudança. Tente de novo.');
  renderAdmin();
}

async function deletePost(id){
  if(!confirm('Excluir este post?'))return;
  if(isPublishing)return;
  isPublishing=true;
  try{
    await savePosts(getPosts().filter(p=>p.id!==id));
    await deletePostPage(id);
    await updateSitemap();
  }catch(e){
    alert('Erro inesperado ao excluir: '+e.message+'. Tente de novo.');
  }finally{
    isPublishing=false;
  }
  renderAdmin();
}

function editPost(id){
  const post=getPosts().find(p=>p.id===id);
  if(!post)return;
  // Switch to new post tab and pre-fill
  switchTab('novo',document.querySelectorAll('.admin-tab')[0]);
  document.getElementById('post-title').value=post.title||'';
  document.getElementById('post-category').value=post.category||'Cotidiano';
  document.getElementById('post-summary').value=post.summary||'';
  if(quillEditor)quillEditor.root.innerHTML=looksLikeHtml(post.body)?(post.body||''):legacyTextToHtml(post.body||'');
  else{const fb=document.getElementById('post-body-fallback');if(fb)fb.value=stripHtml(post.body||'');}
  document.getElementById('post-video').value=post.video||'';
  document.getElementById('post-poll-question').value=post.poll?post.poll.question:'';
  document.getElementById('post-poll-options').value=post.poll?post.poll.options.join('\n'):'';
  uploadedImages=post.images?[...post.images]:[];
  selectedCoverImage=post.coverImage||null;
  if(selectedCoverImage){
    document.getElementById('cover-preview-img').src=selectedCoverImage;
    document.getElementById('cover-preview').style.display='block';
  } else {
    document.getElementById('cover-preview').style.display='none';
  }
  document.getElementById('cover-picker-modal').style.display='none';
  const grid=document.getElementById('imgs-preview-grid');
  grid.innerHTML=uploadedImages.map((src,idx)=>src?`<div class="img-preview-item"><img src="${src}"><button onclick="removeImg(${idx},this)">✕</button></div>`:'').join('');
  // Change publish button to update
  const btn=document.querySelector('.btn-publish');
  btn.textContent='⚡ Atualizar post';
  btn.onclick=()=>{
    updatePost(id);
    btn.textContent='⚡ Publicar agora';
    btn.onclick=publishPost;
  };
  window.scrollTo(0,0);
}

async function updatePost(id){
  if(isPublishing)return;
  const title=document.getElementById('post-title').value.trim();
  if(!title||!quillHasContent()){alert('Título e texto são obrigatórios!');return;}
  const failures=await resolvePendingQuillImages();
  if(failures>0&&!confirm(failures+' imagem(ns) não terminaram de enviar pro servidor e vão ficar mais pesadas no post (em base64). Quer atualizar assim mesmo?'))return;
  const body=getQuillBody();
  const posts=getPosts();
  const idx=posts.findIndex(p=>p.id===id);
  if(idx===-1)return;
  posts[idx]={...posts[idx],title,category:document.getElementById('post-category').value,summary:document.getElementById('post-summary').value.trim(),body,video:document.getElementById('post-video').value.trim(),images:uploadedImages.filter(Boolean),poll:getPollFromForm(),coverImage:selectedCoverImage,archived:false};
  isPublishing=true;
  const btn=document.querySelector('.btn-publish'),originalText=btn.textContent;
  btn.disabled=true;btn.style.opacity='.6';
  let ok=false;
  try{
    if(posts[idx].images.length){
      btn.textContent='⏳ Enviando imagens...';
      posts[idx].images=await processPostImages(posts[idx].id,posts[idx].images);
    }
    btn.textContent='⏳ Atualizando...';
    ok=await savePosts(posts);
    if(ok){btn.textContent='⏳ Atualizando página do post...';await publishPostPage(posts[idx]);await updateSitemap();}
  }catch(e){
    alert('Erro inesperado ao atualizar: '+e.message+'. Tente de novo.');
  }finally{
    btn.disabled=false;btn.style.opacity='';btn.textContent=originalText;
    isPublishing=false;
  }
  ['post-title','post-summary','post-video','post-poll-question','post-poll-options'].forEach(i=>document.getElementById(i).value='');
  if(quillEditor)quillEditor.setContents([]);
  const fb=document.getElementById('post-body-fallback');if(fb)fb.value='';
  document.getElementById('imgs-preview-grid').innerHTML='';uploadedImages=[];
  clearCoverImage();
  if(ok){
    const msg=document.getElementById('success-msg');msg.style.display='block';setTimeout(()=>msg.style.display='none',3000);
    msg.textContent='✓ Post atualizado com sucesso!';
    setTimeout(()=>msg.textContent='✓ Post publicado com sucesso!',3500);
  }
  renderHome();
}

function fmtDate(iso){return new Date(iso).toLocaleDateString('pt-BR',{day:'numeric',month:'short',year:'numeric'});}
function stripHtml(html){const d=document.createElement('div');d.innerHTML=html||'';return d.textContent||d.innerText||'';}
function readTime(text){const t=stripHtml(text);return Math.max(1,Math.round(t.split(' ').length/200))+' min';}

window.addEventListener('scroll',()=>{
  document.getElementById('back-to-top').classList.toggle('visible',window.scrollY>400);
});

const savedTheme=localStorage.getItem('tr_theme')||'dark';
document.documentElement.setAttribute('data-theme',savedTheme);
document.querySelector('.btn-dark').textContent=savedTheme==='dark'?'☀️':'🌙';
